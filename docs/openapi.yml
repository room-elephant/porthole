openapi: 3.1.0
info:
  description: "Discover Docker containers, their service endpoints, and cached image\
    \ version updates."
  title: Porthole API
  version: 0.0.1-SNAPSHOT
servers:
- description: Current Porthole instance
  url: /
tags:
- description: "Pages the user added to the dashboard, separate from Docker containers."
  name: Links
- description: Custom container icons from the Dashboard Icons library or user uploads.
  name: Icons
- description: Status of the configured Docker sources.
  name: Sources
- description: Container inventory and service endpoint discovery across Docker sources.
  name: Containers
- description: Background image version refreshes.
  name: Versions
paths:
  /api/containers:
    get:
      description: "Returns the status of every configured Docker source and a combined\
        \ container inventory. By default, excludes stopped containers and containers\
        \ without resolved service endpoint candidates. Endpoints include the configured\
        \ custom URL and selected flags for navigation; hasWebUi determines tile or\
        \ chip availability. Explicit none keeps available candidates with all selected\
        \ flags false. A failed source is reported as DOWN or ERROR in sources without\
        \ discarding other sources' containers. Image version information comes from\
        \ the background refresh cache and may initially be null."
      operationId: getContainers
      parameters:
      - description: Include containers without resolved service endpoint candidates.
        in: query
        name: includeWithoutEndpoints
        required: false
        schema:
          type: boolean
          default: false
      - description: Include stopped containers; containers without endpoints still
          require includeWithoutEndpoints=true.
        in: query
        name: includeStopped
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerInventoryDTO"
          description: "Container inventory and source statuses, including any source\
            \ failures."
      summary: List discovered containers
      tags:
      - Containers
  /api/containers/icon:
    put:
      description: Saves a Dashboard Icons library icon name. The name is not checked
        against the library. Does not require the container to be currently available.
      operationId: selectIcon_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectContainerIconRequest"
        required: true
      responses:
        "204":
          description: Icon saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or unconfigured identity, or an invalid icon name"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to persist preferences; the prior icon remains in use
      summary: Use a library icon for a container
      tags:
      - Icons
  /api/containers/icon/upload:
    post:
      description: "Saves a PNG, WebP, JPEG or SVG image of at most 1 MB, identified\
        \ from the file's content. Scripts and anything else unsafe are removed from\
        \ an SVG before saving. Replaces any previous icon. Does not require the container\
        \ to be currently available."
      operationId: uploadIcon_1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadContainerIconForm"
        required: true
      responses:
        "204":
          description: Icon saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or unconfigured identity, or an unsupported file type"
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: File larger than 1 MB
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save; the prior icon remains in use
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Uploaded icon limit reached
      summary: Upload an icon for a container
      tags:
      - Icons
  /api/containers/selected-url:
    put:
      description: "Saves a discovered endpoint identity, a custom HTTP(S) URL, or\
        \ the explicit none choice. Explicit null restores automatic selection. Does\
        \ not require the container or endpoint to be currently available."
      operationId: selectEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectContainerEndpointRequest"
        required: true
      responses:
        "204":
          description: Selection saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or unconfigured identity, missing selectedEndpoint,\
            \ or an invalid selection"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to persist preferences; the prior selection remains
            confirmed
      summary: Replace a container's saved endpoint selection
      tags:
      - Containers
  /api/icons/{name}:
    get:
      description: "Upload names are random, so responses never change."
      operationId: getIcon
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: The uploaded image
        "404":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: Unknown or invalid icon name
      summary: Get an uploaded icon
      tags:
      - Icons
  /api/links:
    get:
      operationId: list
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkDTO"
          description: All saved links
      summary: List links
      tags:
      - Links
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkDTO"
          description: Link added
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name, URL or stack"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Link limit reached
      summary: Add a link
      tags:
      - Links
  /api/links/{id}:
    delete:
      description: "Also deletes its uploaded icon, if it has one."
      operationId: delete
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Link deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save; the link remains
      summary: Delete a link
      tags:
      - Links
    put:
      description: Keeps the link's icon.
      operationId: update
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LinkDTO"
          description: Link updated
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name, URL or stack"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save; the prior values remain
      summary: "Replace a link's name, URL and stack"
      tags:
      - Links
  /api/links/{id}/icon:
    put:
      description: Saves a Dashboard Icons library icon name. The name is not checked
        against the library.
      operationId: selectIcon
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectLinkIconRequest"
        required: true
      responses:
        "204":
          description: Icon saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Invalid icon name
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save; the prior icon remains
      summary: Use a library icon for a link
      tags:
      - Links
  /api/links/{id}/icon/upload:
    post:
      description: "Saves a PNG, WebP, JPEG or SVG image of at most 1 MB, identified\
        \ from the file's content. Scripts and anything else unsafe are removed from\
        \ an SVG before saving. Replaces any previous icon."
      operationId: uploadIcon
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadLinkIconForm"
        required: true
      responses:
        "204":
          description: Icon saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unsupported file type
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: File larger than 1 MB
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to save; the prior icon remains
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Uploaded icon limit reached
      summary: Upload an icon for a link
      tags:
      - Links
  /api/sources:
    get:
      description: "Returns every configured source in configuration order with its\
        \ latest status, read from memory without contacting Docker. Always returns\
        \ 200, even when every source is down. Docker status is not part of the health\
        \ endpoints."
      operationId: listSources
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceResponse"
          description: OK
      summary: List Docker sources
      tags:
      - Sources
  /api/versions/refresh:
    post:
      description: Queues an immediate background scan across all configured Docker
        sources. Returns without waiting for Docker or registry checks to finish.
        Read GET /api/containers for cached results while the refresh runs and updated
        results afterward. Repeated requests are coalesced while a source scan is
        queued or running.
      operationId: refreshVersions
      responses:
        "202":
          description: Refresh queued; the response has no body.
      summary: Request an image version refresh
      tags:
      - Versions
components:
  schemas:
    ContainerDTO:
      type: object
      properties:
        displayName:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointDTO"
        hasEndpoints:
          type: boolean
        hasWebUi:
          type: boolean
          description: "Whether the container has a web UI, including unresolved endpoint\
            \ choices"
        iconUrl:
          type: string
        id:
          type: string
        image:
          type: string
        name:
          type: string
        project:
          type:
          - string
          - "null"
        self:
          type: boolean
        sourceId:
          type: string
        state:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
        version:
          oneOf:
          - $ref: "#/components/schemas/VersionInfo"
          - type: "null"
      required:
      - hasWebUi
    ContainerInventoryDTO:
      type: object
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDTO"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDTO"
    EndpointDTO:
      type: object
      description: "Resolved service endpoint candidate, including the saved custom\
        \ URL while configured"
      properties:
        id:
          type: string
        selected:
          type: boolean
          description: Whether this is the effective endpoint for navigation; at most
            one candidate is selected
        source:
          type: string
        url:
          type: string
      required:
      - selected
    LinkDTO:
      type: object
      description: A page the user added to the dashboard
      properties:
        iconUrl:
          type:
          - string
          - "null"
          description: "URL of the chosen icon, or null when none was chosen"
        id:
          type: string
          description: Generated link ID
        name:
          type: string
          description: Name shown on the tile
        stack:
          type:
          - string
          - "null"
          description: "Stack the link belongs to, or null"
        url:
          type: string
          description: Absolute http or https URL
      required:
      - id
      - name
      - url
    LinkRequest:
      type: object
      description: "A link's name, URL and stack. On an update, replaces all three."
      properties:
        name:
          type: string
          description: Name shown on the tile
          example: Router
        stack:
          type:
          - string
          - "null"
          description: Stack the link belongs to. Blank or null means none.
          example: base
        url:
          type: string
          description: Absolute http or https URL without credentials
          example: http://192.168.50.1/
      required:
      - name
      - url
    ProblemDetail:
      type: object
      properties:
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
          format: uri
    SelectContainerEndpointRequest:
      type: object
      description: "Replace the selected endpoint for a container, including temporarily\
        \ unavailable containers"
      properties:
        containerName:
          type: string
          description: "Docker container name, independent of runtime ID or display\
            \ name"
        selectedEndpoint:
          description: Saved endpoint choice; explicit null restores automatic selection
          oneOf:
          - $ref: "#/components/schemas/SelectedEndpointDTO"
          - type: "null"
        sourceId:
          type: string
          description: Docker connection source ID
      required:
      - containerName
      - selectedEndpoint
      - sourceId
    SelectContainerIconRequest:
      type: object
      description: "Use a Dashboard Icons library icon for a container, including\
        \ temporarily unavailable containers"
      properties:
        containerName:
          type: string
          description: "Docker container name, independent of runtime ID or display\
            \ name"
        name:
          type: string
          description: Dashboard Icons library icon name
          example: coredns
        sourceId:
          type: string
          description: Docker connection source ID
      required:
      - containerName
      - name
      - sourceId
    SelectLinkIconRequest:
      type: object
      description: Use a Dashboard Icons library icon for a link
      properties:
        name:
          type: string
          description: Dashboard Icons library icon name
          example: router
      required:
      - name
    SelectedEndpointDTO:
      type: object
      description: Saved endpoint identity. Custom and none are reserved ID/source
        pairs.
      properties:
        id:
          type: string
          description: "Discovered endpoint ID, custom, or none"
        source:
          type: string
          description: "Endpoint provider, custom, or none"
        url:
          type:
          - string
          - "null"
          description: "Absolute HTTP(S) URL without credentials, required only for\
            \ a custom selection"
      required:
      - id
      - source
    SourceDTO:
      type: object
      properties:
        error:
          type:
          - string
          - "null"
        id:
          type: string
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
          - ERROR
    SourceResponse:
      type: object
      description: A configured Docker source and what Porthole last knew about it
      properties:
        error:
          type:
          - string
          - "null"
          description: Why the source is not UP
        id:
          type: string
          description: Configured source ID
          example: walker
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When the source last answered, or null if it never has"
        name:
          type: string
          description: Configured display name
          example: Walker
        status:
          type: string
          description: "UP when the latest check succeeded, DOWN when Docker could\
            \ not be reached in time, ERROR for other failures"
          enum:
          - UP
          - DOWN
          - ERROR
    UploadContainerIconForm:
      type: object
      description: "Upload an icon for a container, including temporarily unavailable\
        \ containers"
      properties:
        containerName:
          type: string
          description: "Docker container name, independent of runtime ID or display\
            \ name"
        file:
          type: string
          format: binary
          description: "PNG, WebP, JPEG or SVG image of at most 1 MB"
        sourceId:
          type: string
          description: Docker connection source ID
      required:
      - containerName
      - file
      - sourceId
    UploadLinkIconForm:
      type: object
      description: Upload an icon for a link
      properties:
        file:
          type: string
          format: binary
          description: "PNG, WebP, JPEG or SVG image of at most 1 MB"
      required:
      - file
    VersionInfo:
      type: object
      properties:
        currentVersion:
          type:
          - string
          - "null"
        latestVersion:
          type:
          - string
          - "null"
        updateAvailable:
          type: boolean

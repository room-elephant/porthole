openapi: 3.1.0
info:
  description: "Discover Docker containers, their service endpoints, and cached image\
    \ version updates."
  title: Porthole API
  version: 0.0.1-SNAPSHOT
servers:
- description: Current Porthole instance
  url: /
tags:
- description: Container inventory and service endpoint discovery across Docker sources.
  name: Containers
- description: Background image version refreshes.
  name: Versions
paths:
  /api/containers:
    get:
      description: "Returns the status of every configured Docker source and a combined\
        \ container inventory. By default, excludes stopped containers and containers\
        \ without resolved service endpoint candidates. Endpoints include the configured\
        \ custom URL and selected flags for navigation; hasWebUi determines tile or\
        \ chip availability. Explicit none keeps available candidates with all selected\
        \ flags false. A failed source is reported as DOWN or ERROR in sources without\
        \ discarding other sources' containers. Image version information comes from\
        \ the background refresh cache and may initially be null."
      operationId: getContainers
      parameters:
      - description: Include containers without resolved service endpoint candidates.
        in: query
        name: includeWithoutEndpoints
        required: false
        schema:
          type: boolean
          default: false
      - description: Include stopped containers; containers without endpoints still
          require includeWithoutEndpoints=true.
        in: query
        name: includeStopped
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerInventoryDTO"
          description: "Container inventory and source statuses, including any source\
            \ failures."
      summary: List discovered containers
      tags:
      - Containers
  /api/containers/selected-url:
    put:
      description: "Saves a discovered endpoint identity, a custom HTTP(S) URL, or\
        \ the explicit none choice. Explicit null restores automatic selection. Does\
        \ not require the container or endpoint to be currently available."
      operationId: selectEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectContainerEndpointRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectContainerEndpointResponse"
          description: Confirmed saved preferences
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or unconfigured identity, missing preferences or selectedEndpoint,\
            \ or an invalid selection"
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Failed to persist preferences; the prior selection remains
            confirmed
      summary: Replace a container's saved endpoint selection
      tags:
      - Containers
  /api/versions/refresh:
    post:
      description: Queues an immediate background scan across all configured Docker
        sources. Returns without waiting for Docker or registry checks to finish.
        Read GET /api/containers for cached results while the refresh runs and updated
        results afterward. Repeated requests are coalesced while a source scan is
        queued or running.
      operationId: refreshVersions
      responses:
        "202":
          description: Refresh queued; the response has no body.
      summary: Request an image version refresh
      tags:
      - Versions
components:
  schemas:
    ContainerDTO:
      type: object
      properties:
        displayName:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointDTO"
        hasEndpoints:
          type: boolean
        hasWebUi:
          type: boolean
          description: "Whether the container has a web UI, including unresolved endpoint\
            \ choices"
        iconUrl:
          type: string
        id:
          type: string
        image:
          type: string
        name:
          type: string
        project:
          type:
          - string
          - "null"
        self:
          type: boolean
        sourceId:
          type: string
        state:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
        version:
          oneOf:
          - $ref: "#/components/schemas/VersionInfo"
          - type: "null"
      required:
      - hasWebUi
    ContainerInventoryDTO:
      type: object
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDTO"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDTO"
    ContainerPreferencesDTO:
      type: object
      description: Shared container preferences for selection commands and confirmations
      properties:
        selectedEndpoint:
          description: Saved endpoint choice; explicit null restores automatic selection
          oneOf:
          - $ref: "#/components/schemas/SelectedEndpointDTO"
          - type: "null"
      required:
      - selectedEndpoint
    EndpointDTO:
      type: object
      description: "Resolved service endpoint candidate, including the saved custom\
        \ URL while configured"
      properties:
        id:
          type: string
        selected:
          type: boolean
          description: Whether this is the effective endpoint for navigation; at most
            one candidate is selected
        source:
          type: string
        url:
          type: string
      required:
      - selected
    ProblemDetail:
      type: object
      properties:
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
          format: uri
    SelectContainerEndpointRequest:
      type: object
      description: "Replace the selected endpoint for a container, including temporarily\
        \ unavailable containers"
      properties:
        containerName:
          type: string
          description: "Docker container name, independent of runtime ID or display\
            \ name"
        preferences:
          $ref: "#/components/schemas/ContainerPreferencesDTO"
        sourceId:
          type: string
          description: Docker connection source ID
      required:
      - containerName
      - preferences
      - sourceId
    SelectContainerEndpointResponse:
      type: object
      description: Confirmed saved preferences for the identified container
      properties:
        containerName:
          type: string
        preferences:
          $ref: "#/components/schemas/ContainerPreferencesDTO"
        sourceId:
          type: string
    SelectedEndpointDTO:
      type: object
      description: Saved endpoint identity. Custom and none are reserved ID/source
        pairs.
      properties:
        id:
          type: string
          description: "Discovered endpoint ID, custom, or none"
        source:
          type: string
          description: "Endpoint provider, custom, or none"
        url:
          type:
          - string
          - "null"
          description: "Absolute HTTP(S) URL without credentials, required only for\
            \ a custom selection"
      required:
      - id
      - source
    SourceDTO:
      type: object
      properties:
        error:
          type:
          - string
          - "null"
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
          - ERROR
    VersionInfo:
      type: object
      properties:
        currentVersion:
          type:
          - string
          - "null"
        latestVersion:
          type:
          - string
          - "null"
        updateAvailable:
          type: boolean

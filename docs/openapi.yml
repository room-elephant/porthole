openapi: 3.1.0
info:
  description: "Discover Docker containers, their service endpoints, and cached image\
    \ version updates."
  title: Porthole API
  version: 0.0.1-SNAPSHOT
servers:
- description: Current Porthole instance
  url: /
tags:
- description: "Uploaded icon images, shared by content."
  name: Icons
- description: Image version checks.
  name: Versions
- description: What the user saved for containers and links.
  name: Entries
- description: "Everything the dashboard shows, in one read."
  name: Dashboard
- description: Status of the configured Docker sources.
  name: Sources
paths:
  /api/dashboard:
    get:
      description: "Every configured source's state and every entry: each container\
        \ a source lists or still retains after a failure, including stopped ones\
        \ and ones without endpoints, then each link. Saved names, icons and endpoint\
        \ choices are applied. Clients filter. Reads only memory, so it never waits\
        \ on Docker or a registry."
      operationId: getDashboard
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
          description: "The dashboard, including source failures"
      summary: Read the dashboard
      tags:
      - Dashboard
  /api/entries:
    post:
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
          description: Link added; returns the link as the dashboard shows it
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name, URL, stack or icon, or an icon that was never\
            \ uploaded"
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Link limit reached
      summary: Add a link
      tags:
      - Entries
  /api/entries/{id}:
    delete:
      operationId: deleteEntry
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Link deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Containers can't be deleted
      summary: Delete a link
      tags:
      - Entries
    patch:
      description: "JSON Merge Patch of name, icon, endpoint and stack. A missing\
        \ field is kept and null removes the override. A link needs a name and a URL,\
        \ and only links have a stack. endpoint is {\"id\": candidate} or \"none\"\
        \ for containers, or {\"url\": url} for either. A container is accepted whether\
        \ or not it is currently running, if its source is configured."
      operationId: updateEntry
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntryResponse"
          description: Saved; returns the entry as the dashboard now shows it
        "204":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EntryResponse"
          description: Saved for a container no source currently lists
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A field is invalid for this kind of entry
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown link, unconfigured source or malformed ID"
      summary: Change an entry
      tags:
      - Entries
  /api/events:
    get:
      description: "Server-sent events that signal dashboard changes without carrying\
        \ them. The stream opens with one `changed` event and sends another, coalesced\
        \ over 250 ms, whenever the dashboard changes; each has data `{\"revision\"\
        :N}`. Refetch GET /api/dashboard when the revision differs from the one you\
        \ have. A keepalive comment follows every 15 seconds, and `retry` asks clients\
        \ to reconnect after 5 seconds. At most 100 streams are open at once."
      operationId: streamEvents
      responses:
        "200":
          content:
            text/event-stream: {}
          description: The event stream
        "503":
          description: "Too many open streams, or the server is stopping; the response\
            \ has no body"
      summary: Stream dashboard changes
      tags:
      - Dashboard
  /api/icons:
    post:
      description: "Takes the raw image as the body, with any content type. Accepts\
        \ PNG, WebP, JPEG or SVG of at most 1 MB, identified from the content; scripts\
        \ and anything else unsafe are removed from an SVG. Returns an ID to save\
        \ on an entry. The same image always gets the same ID. An upload no entry\
        \ uses is removed after about an hour."
      operationId: uploadIcon
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
          description: Icon stored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not a PNG, WebP, JPEG or SVG image"
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Larger than 1 MB
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Uploaded icon limit reached
      summary: Upload an icon
      tags:
      - Icons
  /api/icons/{id}:
    get:
      description: "An icon's ID is the hash of its content, so a response never changes."
      operationId: getIcon
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: The uploaded image
        "404":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: Unknown or invalid icon ID
      summary: Get an uploaded icon
      tags:
      - Icons
  /api/sources:
    get:
      description: "Returns every configured source in configuration order with its\
        \ latest status, read from memory without contacting Docker. Always returns\
        \ 200, even when every source is down. Docker status is not part of the health\
        \ endpoints."
      operationId: listSources
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceResponse"
          description: OK
      summary: List Docker sources
      tags:
      - Sources
  /api/version-checks:
    post:
      description: "Checks every container on every source for image updates in the\
        \ background, bypassing cached registry answers. Returns without waiting for\
        \ Docker or registries. While it runs, GET /api/dashboard reports versionChecks.running,\
        \ and GET /api/events signals each result and the end of the run. A request\
        \ while a check is running does nothing."
      operationId: startVersionCheck
      responses:
        "202":
          description: Check started or already running; no body
      summary: Start a version check
      tags:
      - Versions
components:
  schemas:
    ContainerResponse:
      type: object
      properties:
        defaultName:
          type: string
          description: Name shown when none is saved
        image:
          type: string
        name:
          type: string
          description: Docker container name
        self:
          type: boolean
          description: Whether this is the container Porthole runs in
        sourceId:
          type: string
        state:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
        version:
          description: Cached version check result; null until checked
          oneOf:
          - $ref: "#/components/schemas/VersionInfo"
          - type: "null"
    CreateLinkRequest:
      type: object
      description: A new link
      properties:
        icon:
          description: "Icon choice: {\"library\": name} or {\"upload\": id from POST\
            \ /api/icons}"
          example:
            library: router
          oneOf:
          - $ref: "#/components/schemas/JsonNode"
          - type: "null"
        name:
          type:
          - string
          - "null"
          description: "Name shown on the tile, 1–255 characters"
        stack:
          type:
          - string
          - "null"
          description: Stack the link belongs to; blank or null for none
        url:
          type:
          - string
          - "null"
          description: Absolute HTTP(S) URL without credentials
      required:
      - name
      - url
    CreatedResponse:
      type: object
      description: The ID of what was created
      properties:
        id:
          type: string
      required:
      - id
    DashboardResponse:
      type: object
      description: "Every source's state and every entry, unfiltered"
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntryResponse"
        revision:
          type: integer
          format: int64
          description: Changes whenever anything shown here changes; GET /api/events
            signals new ones
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceState"
        versionChecks:
          $ref: "#/components/schemas/VersionChecksResponse"
    EndpointResponse:
      type: object
      properties:
        id:
          type: string
        selected:
          type: boolean
        source:
          type: string
        url:
          type: string
    EntryResponse:
      type: object
      description: "A container or link on the dashboard, with saved overrides applied"
      properties:
        container:
          description: Docker facts; null for a link
          oneOf:
          - $ref: "#/components/schemas/ContainerResponse"
          - type: "null"
        endpoints:
          type: array
          description: Addresses the tile can open; at most one is selected
          items:
            $ref: "#/components/schemas/EndpointResponse"
        hasWebUi:
          type: boolean
          description: False for an explicit no-web-UI choice or when there are no
            endpoints
        icon:
          $ref: "#/components/schemas/IconResponse"
        id:
          type: string
          description: "Entry ID, for /api/entries/{id}"
          example: container:walker:smh-sonarr-1
        kind:
          type: string
          description: container or link
          enum:
          - container
          - link
        name:
          type: string
          description: "Name shown on the tile: the saved name, else the container's\
            \ default name"
        stack:
          type:
          - string
          - "null"
          description: "Compose project for a container, saved stack for a link"
    IconChoice:
      type: object
      description: Exactly one of library or upload
      properties:
        library:
          type:
          - string
          - "null"
          description: Dashboard Icons library name
        upload:
          type:
          - string
          - "null"
          description: Uploaded icon ID
    IconResponse:
      type: object
      description: "The icon shown, and the saved choice when the user picked one"
      properties:
        choice:
          description: "The saved choice, or null when the default is shown"
          oneOf:
          - $ref: "#/components/schemas/IconChoice"
          - type: "null"
        url:
          type:
          - string
          - "null"
          description: Image URL; null for a link without an icon
    JsonNode:
      type: object
      properties:
        array:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        binary:
          type: boolean
        boolean:
          type: boolean
        container:
          type: boolean
        double:
          type: boolean
        embeddedValue:
          type: boolean
        empty:
          type: boolean
        float:
          type: boolean
        floatingPointNumber:
          type: boolean
        int:
          type: boolean
        integralNumber:
          type: boolean
        long:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        "null":
          type: boolean
        number:
          type: boolean
        object:
          type: boolean
        pojo:
          type: boolean
        short:
          type: boolean
        string:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        valueNode:
          type: boolean
    ProblemDetail:
      type: object
      properties:
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
          format: uri
    SourceResponse:
      type: object
      description: A configured Docker source and what Porthole last knew about it
      properties:
        error:
          type:
          - string
          - "null"
          description: Why the source is not UP
        id:
          type: string
          description: Configured source ID
          example: walker
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When the source last answered, or null if it never has"
        name:
          type: string
          description: Configured display name
          example: Walker
        status:
          type: string
          description: "UP when the latest check succeeded, DOWN when Docker could\
            \ not be reached in time, ERROR for other failures"
          enum:
          - UP
          - DOWN
          - ERROR
    SourceState:
      type: object
      description: A configured Docker source and what Porthole last knew about it
      properties:
        error:
          type:
          - string
          - "null"
          description: Why the source is not UP
        id:
          type: string
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When the source last answered, or null if it never has"
        name:
          type: string
        status:
          type: string
          description: "UP, DOWN or ERROR"
          enum:
          - UP
          - DOWN
          - ERROR
    VersionChecksResponse:
      type: object
      description: Manual version checks started with POST /api/version-checks
      properties:
        lastCompletedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When the last check finished, or null if none has since startup"
        running:
          type: boolean
          description: Whether a check is running
    VersionInfo:
      type: object
      properties:
        currentVersion:
          type:
          - string
          - "null"
        latestVersion:
          type:
          - string
          - "null"
        updateAvailable:
          type: boolean

openapi: 3.1.0
info:
  description: "Discover Docker containers, their service endpoints, and cached image\
    \ version updates."
  title: Porthole API
  version: 0.0.1-SNAPSHOT
servers:
- description: Current Porthole instance
  url: /
tags:
- description: "Pages the user added to the dashboard, separate from Docker containers."
  name: Links
- description: "Uploaded icon images, shared by content."
  name: Icons
- description: What the user saved for containers and links.
  name: Entries
- description: Status of the configured Docker sources.
  name: Sources
- description: Container inventory and service endpoint discovery across Docker sources.
  name: Containers
- description: Background image version refreshes.
  name: Versions
paths:
  /api/containers:
    get:
      description: "Returns the status of every configured Docker source and a combined\
        \ container inventory. By default, excludes stopped containers and containers\
        \ without resolved service endpoint candidates. Endpoints include the configured\
        \ custom URL and selected flags for navigation; hasWebUi determines tile or\
        \ chip availability. Explicit none keeps available candidates with all selected\
        \ flags false. A failed source is reported as DOWN or ERROR in sources without\
        \ discarding other sources' containers. Image version information comes from\
        \ the background refresh cache and may initially be null."
      operationId: getContainers
      parameters:
      - description: Include containers without resolved service endpoint candidates.
        in: query
        name: includeWithoutEndpoints
        required: false
        schema:
          type: boolean
          default: false
      - description: Include stopped containers; containers without endpoints still
          require includeWithoutEndpoints=true.
        in: query
        name: includeStopped
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContainerInventoryDTO"
          description: "Container inventory and source statuses, including any source\
            \ failures."
      summary: List discovered containers
      tags:
      - Containers
  /api/entries:
    post:
      operationId: createLink
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
          description: Link added
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invalid name, URL, stack or icon, or an icon that was never\
            \ uploaded"
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Link limit reached
      summary: Add a link
      tags:
      - Entries
  /api/entries/{id}:
    delete:
      operationId: deleteEntry
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Link deleted
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Unknown link
        "405":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Containers can't be deleted
      summary: Delete a link
      tags:
      - Entries
    patch:
      description: "JSON Merge Patch of name, icon, endpoint and stack. A missing\
        \ field is kept and null removes the override. A link needs a name and a URL,\
        \ and only links have a stack. endpoint is {\"id\": candidate} or \"none\"\
        \ for containers, or {\"url\": url} for either. A container is accepted whether\
        \ or not it is currently running, if its source is configured."
      operationId: updateEntry
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
        required: true
      responses:
        "204":
          description: Saved
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A field is invalid for this kind of entry
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Unknown link, unconfigured source or malformed ID"
      summary: Change an entry
      tags:
      - Entries
  /api/icons:
    post:
      description: "Takes the raw image as the body, with any content type. Accepts\
        \ PNG, WebP, JPEG or SVG of at most 1 MB, identified from the content; scripts\
        \ and anything else unsafe are removed from an SVG. Returns an ID to save\
        \ on an entry. The same image always gets the same ID. An upload no entry\
        \ uses is removed after about an hour."
      operationId: uploadIcon
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedResponse"
          description: Icon stored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Not a PNG, WebP, JPEG or SVG image"
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Larger than 1 MB
        "507":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Uploaded icon limit reached
      summary: Upload an icon
      tags:
      - Icons
  /api/icons/{id}:
    get:
      description: "An icon's ID is the hash of its content, so a response never changes."
      operationId: getIcon
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: The uploaded image
        "404":
          content:
            image/jpeg:
              schema:
                type: string
                format: byte
            image/png:
              schema:
                type: string
                format: byte
            image/svg+xml:
              schema:
                type: string
                format: byte
            image/webp:
              schema:
                type: string
                format: byte
          description: Unknown or invalid icon ID
      summary: Get an uploaded icon
      tags:
      - Icons
  /api/links:
    get:
      description: "Links are entries: add, change and delete them through /api/entries."
      operationId: listLinks
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkDTO"
          description: All saved links
      summary: List links
      tags:
      - Links
  /api/sources:
    get:
      description: "Returns every configured source in configuration order with its\
        \ latest status, read from memory without contacting Docker. Always returns\
        \ 200, even when every source is down. Docker status is not part of the health\
        \ endpoints."
      operationId: listSources
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceResponse"
          description: OK
      summary: List Docker sources
      tags:
      - Sources
  /api/versions/refresh:
    post:
      description: Queues an immediate background scan across all configured Docker
        sources. Returns without waiting for Docker or registry checks to finish.
        Read GET /api/containers for cached results while the refresh runs and updated
        results afterward. Repeated requests are coalesced while a source scan is
        queued or running.
      operationId: refreshVersions
      responses:
        "202":
          description: Refresh queued; the response has no body.
      summary: Request an image version refresh
      tags:
      - Versions
components:
  schemas:
    ContainerDTO:
      type: object
      properties:
        displayName:
          type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/EndpointDTO"
        entryId:
          type: string
          description: "Entry ID, for PATCH /api/entries/{id}"
        hasEndpoints:
          type: boolean
        hasWebUi:
          type: boolean
          description: "Whether the container has a web UI, including unresolved endpoint\
            \ choices"
        iconUrl:
          type: string
        id:
          type: string
        image:
          type: string
        name:
          type: string
        project:
          type:
          - string
          - "null"
        self:
          type: boolean
        sourceId:
          type: string
        state:
          type:
          - string
          - "null"
        status:
          type:
          - string
          - "null"
        version:
          oneOf:
          - $ref: "#/components/schemas/VersionInfo"
          - type: "null"
      required:
      - entryId
      - hasWebUi
    ContainerInventoryDTO:
      type: object
      properties:
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerDTO"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceDTO"
    CreateLinkRequest:
      type: object
      description: A new link
      properties:
        icon:
          description: "Icon choice: {\"library\": name} or {\"upload\": id from POST\
            \ /api/icons}"
          example:
            library: router
          oneOf:
          - $ref: "#/components/schemas/JsonNode"
          - type: "null"
        name:
          type:
          - string
          - "null"
          description: "Name shown on the tile, 1–255 characters"
        stack:
          type:
          - string
          - "null"
          description: Stack the link belongs to; blank or null for none
        url:
          type:
          - string
          - "null"
          description: Absolute HTTP(S) URL without credentials
      required:
      - name
      - url
    CreatedResponse:
      type: object
      description: The ID of what was created
      properties:
        id:
          type: string
      required:
      - id
    EndpointDTO:
      type: object
      description: "Resolved service endpoint candidate, including the saved custom\
        \ URL while configured"
      properties:
        id:
          type: string
        selected:
          type: boolean
          description: Whether this is the effective endpoint for navigation; at most
            one candidate is selected
        source:
          type: string
        url:
          type: string
      required:
      - selected
    JsonNode:
      type: object
      properties:
        array:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        binary:
          type: boolean
        boolean:
          type: boolean
        container:
          type: boolean
        double:
          type: boolean
        embeddedValue:
          type: boolean
        empty:
          type: boolean
        float:
          type: boolean
        floatingPointNumber:
          type: boolean
        int:
          type: boolean
        integralNumber:
          type: boolean
        long:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        "null":
          type: boolean
        number:
          type: boolean
        object:
          type: boolean
        pojo:
          type: boolean
        short:
          type: boolean
        string:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        valueNode:
          type: boolean
    LinkDTO:
      type: object
      description: A page the user added to the dashboard
      properties:
        iconUrl:
          type:
          - string
          - "null"
          description: "URL of the chosen icon, or null when none was chosen"
        id:
          type: string
          description: "Entry ID, for /api/entries/{id}"
        name:
          type: string
          description: Name shown on the tile
        stack:
          type:
          - string
          - "null"
          description: "Stack the link belongs to, or null"
        url:
          type: string
          description: Absolute http or https URL
      required:
      - id
      - name
      - url
    ProblemDetail:
      type: object
      properties:
        detail:
          type:
          - string
          - "null"
        instance:
          type:
          - string
          - "null"
          format: uri
        properties:
          type:
          - object
          - "null"
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type:
          - string
          - "null"
        type:
          type:
          - string
          - "null"
          format: uri
    SourceDTO:
      type: object
      properties:
        error:
          type:
          - string
          - "null"
        id:
          type: string
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
        name:
          type: string
        status:
          type: string
          enum:
          - UP
          - DOWN
          - ERROR
    SourceResponse:
      type: object
      description: A configured Docker source and what Porthole last knew about it
      properties:
        error:
          type:
          - string
          - "null"
          description: Why the source is not UP
        id:
          type: string
          description: Configured source ID
          example: walker
        lastSuccessAt:
          type:
          - string
          - "null"
          format: date-time
          description: "When the source last answered, or null if it never has"
        name:
          type: string
          description: Configured display name
          example: Walker
        status:
          type: string
          description: "UP when the latest check succeeded, DOWN when Docker could\
            \ not be reached in time, ERROR for other failures"
          enum:
          - UP
          - DOWN
          - ERROR
    VersionInfo:
      type: object
      properties:
        currentVersion:
          type:
          - string
          - "null"
        latestVersion:
          type:
          - string
          - "null"
        updateAvailable:
          type: boolean

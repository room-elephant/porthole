name: Reusable Client Workflow

on:
  workflow_call:
    inputs:
      upload_coverage:
        required: false
        type: boolean
        default: false
      upload_artifact:
        required: false
        type: boolean
        default: false

jobs:
  client-test:
    name: Client Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: make install

      - name: Run ESLint
        working-directory: client
        run: make lint

      - name: Run tests with coverage
        working-directory: client
        run: make test

      - name: Generate coverage summary
        if: ${{ inputs.upload_coverage }}
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2
        with:
          working-directory: client
          comment-on: none

      - name: Build application
        working-directory: client
        run: make build

      - name: Upload client dist
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 1

name: Reusable Server Workflow

on:
  workflow_call:
    inputs:
      upload_coverage:
        required: false
        type: boolean
        default: false

jobs:
  server-test:
    name: Server Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check code formatting
        working-directory: server
        run: mvn -B -ntp spotless:check

      - name: Build
        working-directory: server
        run: mvn -B -ntp compile -Dspotless.check.skip=true

      - name: Run unit tests
        working-directory: server
        run: mvn -B -ntp test -Dspotless.check.skip=true

      - name: Generate unit test coverage report
        if: ${{ inputs.upload_coverage }}
        run: |
          echo "## Unit Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Category | Percentage | Covered / Total |" >> $GITHUB_STEP_SUMMARY
          echo "|:------:|----------|------------|-----------------|" >> $GITHUB_STEP_SUMMARY
          awk -F, '
            function pct(c,m) { return (c+m>0) ? c*100/(c+m) : 0 }
            function icon(p,t) { return (p>=t) ? ":green_circle:" : (p>=t-10) ? ":large_blue_circle:" : ":red_circle:" }
            NR>1 {
              inst_m+=$4; inst_c+=$5; br_m+=$6; br_c+=$7; ln_m+=$8; ln_c+=$9; mth_m+=$12; mth_c+=$13
            }
            END {
              lp=pct(ln_c,ln_m); bp=pct(br_c,br_m); mp=pct(mth_c,mth_m); ip=pct(inst_c,inst_m)
              printf "| %s | Lines | %.2f%% (🎯 70%%) | %d / %d |\n", icon(lp,70), lp, ln_c, ln_c+ln_m
              printf "| %s | Branches | %.2f%% (🎯 80%%) | %d / %d |\n", icon(bp,80), bp, br_c, br_c+br_m
              printf "| %s | Methods | %.2f%% (🎯 80%%) | %d / %d |\n", icon(mp,80), mp, mth_c, mth_c+mth_m
              printf "| %s | Instructions | %.2f%% (🎯 80%%) | %d / %d |\n", icon(ip,80), ip, inst_c, inst_c+inst_m
            }
          ' server/target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY

      - name: Package
        working-directory: server
        run: mvn -B -ntp package -DskipTests -Dspotless.check.skip=true

      - name: Build integration test Docker image
        run: docker build -t porthole-it:latest -f docker/Dockerfile.it .

      - name: Run integration tests and generate native image hints
        working-directory: server
        run: mvn -B -ntp verify -Pgenerate-native-hints -Dspotless.check.skip=true

      - name: Check for stale native image hints
        run: |
          python3 - <<'EOF'
          import json, sys, subprocess

          hints_file = "server/src/main/resources/META-INF/native-image/com.roomelephant/porthole/reachability-metadata.json"

          committed_json = subprocess.run(
              ["git", "show", f"HEAD:{hints_file}"], capture_output=True, text=True, check=True
          ).stdout
          with open(hints_file) as f:
              generated_json = f.read()

          def extract_types(data):
              return {
                  (e["type"] if isinstance(e["type"], str) else e["type"]["name"])
                  for e in data.get("reflection", [])
                  if isinstance(e, dict) and "type" in e
              }

          committed_types = extract_types(json.loads(committed_json))
          generated_types = extract_types(json.loads(generated_json))

          new_types = generated_types - committed_types
          if new_types:
              print("::error::Native image hints are stale — new reflection entries detected that are not in the committed file:")
              for t in sorted(new_types):
                  print(f"  + {t}")
              print("Run 'mvn verify -Pgenerate-native-hints' locally and commit the updated files.")
              sys.exit(1)

          print(f"Hints up to date. Generated: {len(generated_types)} types, committed: {len(committed_types)} types.")
          EOF

      - name: Generate integration test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: server/target/failsafe-reports/TEST-*.xml
          check_name: Integration Test Results
          comment_mode: off

name: CI - Docker

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/ci-docker.yml'
      - '.github/workflows/reusable-docker.yml'

jobs:
  docker:
    uses: ./.github/workflows/reusable-docker.yml
    permissions:
      contents: read

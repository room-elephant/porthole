name: CI - Server

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
      - '.github/workflows/reusable-server.yml'

jobs:
  server:
    uses: ./.github/workflows/reusable-server.yml
    permissions:
      contents: read
      checks: write
    with:
      upload_coverage: true



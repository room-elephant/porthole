name: CI - Client

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/ci-client.yml'
      - '.github/workflows/reusable-client.yml'

jobs:
  client:
    uses: ./.github/workflows/reusable-client.yml
    permissions:
      contents: read
    with:
      upload_coverage: true



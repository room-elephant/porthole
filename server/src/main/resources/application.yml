spring:
  application:
    name: porthole
    version: "@project.version@"
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  banner.location: classpath:/banner.txt

server:
  port: 9753
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024

springdoc:
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      show-components: always

porthole:
  preferences:
    path: data/preferences.json
  # Docker configuration
  docker:
    connections:
      - id: local
        name: Local
        host: unix:///var/run/docker.sock
        published-host: 127.0.0.1
        connection-timeout: 5s
        response-timeout: 60s
  # Registry configuration
  versions:
    refresh-interval: 1h
  registry:
    timeout:
      connect: 5s
      read: 10s
    cache:
      ttl: 1h
      version-max-size: 100
    dockerhub:
      registry-url: "https://registry-1.docker.io/v2/"
      auth-url: "https://auth.docker.io/token?service=registry.docker.io&scope=repository:"
      repositories-url: "https://hub.docker.com/v2/repositories/"
    ghcr:
      registry-url: "https://ghcr.io/v2/"
      auth-url: "https://ghcr.io/token?service=ghcr.io&scope=repository:"
  # Icon configuration
  dashboard:
    icons:
      path: /app/config/icons.yml
      url: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp
      extension: .webp
